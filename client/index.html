<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Royal Crest Hotel &amp; Suites | Five-Star Luxury Hotel in Lagos</title>
    <meta
      name="description"
      content="Royal Crest Hotel & Suites is a five-star luxury hotel in Victoria Island, Lagos. Elegant rooms and suites, fine dining, rooftop pool, spa and event halls. Book direct for the best rates."
    />
    <link rel="canonical" href="https://www.royalcresthotel.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Royal Crest Hotel & Suites" />
    <meta property="og:title" content="Royal Crest Hotel & Suites | Experience Luxury Beyond Expectations" />
    <meta property="og:description" content="Five-star rooms and suites, fine dining, rooftop pool and spa in the heart of Victoria Island, Lagos." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Royal Crest Hotel & Suites",
        "description": "Five-star luxury hotel with elegant rooms and suites, fine dining, rooftop pool, spa and event halls.",
        "url": "https://www.royalcresthotel.example/",
        "image": "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80",
        "telephone": "+234 1 700 0100",
        "email": "reservations@royalcresthotel.com",
        "starRating": { "@type": "Rating", "ratingValue": "5" },
        "priceRange": "$$$$",
        "checkinTime": "14:00",
        "checkoutTime": "12:00",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "12 Crest Avenue, Victoria Island",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Swimming pool", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Spa", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Fitness centre", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "24-hour room service", "value": true }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Royal Crest Hotel &amp; Suites needs JavaScript enabled to show availability and take reservations. Call +234 1 700 0100 to book.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
